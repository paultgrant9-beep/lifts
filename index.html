<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Weightlifting Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="app-title">Weightlifting Tracker</h1>
    </header>

    <main id="app">
      <!-- Home Screen -->
      <section id="home-screen" class="screen active">
        <div id="resume-banner" class="routine-item resume-banner" hidden>
          <div id="resume-text" class="routine-name"></div>
          <div class="button-row">
            <button id="discard-active-btn" class="secondary">Discard</button>
            <button id="resume-btn">Resume</button>
          </div>
        </div>
        <div id="routines-container" class="routine-list"></div>
        <button id="add-routine-btn">Add routine</button>
        <button id="history-btn" class="secondary">History</button>

        <hr class="divider">

        <div class="button-row">
          <button id="export-btn" class="secondary">Export</button>
          <button id="import-btn" class="secondary">Import</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </section>

      <!-- Routine Editor Screen -->
      <section id="editor-screen" class="screen">
        <div class="form-group">
          <label for="routine-name-input">Routine Name</label>
          <input type="text" id="routine-name-input" placeholder="e.g., Push Day">
        </div>

        <div id="exercises-container" class="exercise-list"></div>

        <hr class="divider">

        <div id="exercise-form-container" style="display: none;">
          <h3 id="exercise-form-title">Add Exercise</h3>
          <div class="form-group">
            <label for="ex-name">Name</label>
            <input type="text" id="ex-name" placeholder="e.g., Bench Press">
          </div>
          <div class="form-group">
            <label for="ex-sets">Sets</label>
            <input type="number" id="ex-sets" value="3" min="1" step="1" inputmode="numeric">
          </div>
          <div class="form-group">
            <label for="ex-reps">Reps</label>
            <input type="number" id="ex-reps" value="10" min="1" step="1" inputmode="numeric">
          </div>
          <div class="form-group">
            <label for="ex-weight">Weight (lbs)</label>
            <input type="number" id="ex-weight" value="135" min="0" step="any" inputmode="decimal">
          </div>
          <div class="form-group">
            <label for="ex-increment">Increment (lbs)</label>
            <input type="number" id="ex-increment" value="5" min="0" step="any" inputmode="decimal">
          </div>
          <div class="button-row">
            <button id="cancel-exercise-btn" class="secondary">Cancel</button>
            <button id="save-exercise-btn">Save Exercise</button>
          </div>
        </div>

        <button id="add-exercise-btn">Add Exercise</button>

        <div class="button-row">
          <button id="back-btn" class="secondary">Back</button>
          <button id="delete-routine-btn" class="danger">Delete Routine</button>
        </div>
      </section>

      <!-- Workout Screen -->
      <section id="workout-screen" class="screen">
        <h2 id="workout-title"></h2>
        <p class="muted">Tap a bubble when you finish a set. Tap again to lower the reps if you fell short.</p>
        <div id="workout-exercises" class="exercise-list"></div>
        <button id="finish-workout-btn">Finish Workout</button>
        <button id="cancel-workout-btn" class="secondary">Cancel Workout</button>
        <div id="rest-timer" class="rest-timer" hidden>
          <span class="rest-label">Rest</span>
          <span id="rest-time" class="rest-time">0:00</span>
        </div>
      </section>

      <!-- Workout Summary Screen -->
      <section id="summary-screen" class="screen">
        <h2>Workout Saved</h2>
        <div id="summary-content"></div>
        <button id="summary-done-btn">Done</button>
      </section>

      <!-- History: list of exercises -->
      <section id="history-screen" class="screen">
        <h2>History</h2>
        <div id="history-list" class="exercise-list"></div>
        <button id="history-back-btn" class="secondary">Back</button>
        <button id="clear-all-history-btn" class="danger">Clear All History</button>
      </section>

      <!-- History: one exercise's log entries -->
      <section id="history-detail-screen" class="screen">
        <h2 id="history-detail-title"></h2>
        <div class="segmented" role="tablist">
          <button id="view-table-btn" class="secondary" role="tab">Table</button>
          <button id="view-chart-btn" class="secondary" role="tab">Chart</button>
        </div>
        <div id="history-view"></div>
        <button id="history-detail-back-btn" class="secondary">Back</button>
        <button id="clear-exercise-history-btn" class="danger">Clear This Exercise's History</button>
      </section>

      <!-- History: edit one log entry -->
      <section id="log-edit-screen" class="screen">
        <h2 id="log-edit-title">Edit Entry</h2>
        <p id="log-edit-target" class="muted"></p>
        <div class="form-group">
          <label for="log-date">Date</label>
          <input type="date" id="log-date">
        </div>
        <div class="form-group">
          <label for="log-weight">Weight (lbs)</label>
          <input type="number" id="log-weight" min="0" step="any" inputmode="decimal">
        </div>
        <label>Reps per set</label>
        <div id="log-sets" class="set-inputs"></div>
        <div class="button-row">
          <button id="log-cancel-btn" class="secondary">Cancel</button>
          <button id="log-save-btn">Save</button>
        </div>
        <button id="log-delete-btn" class="danger">Delete Entry</button>
      </section>
    </main>
  </div>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
